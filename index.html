<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zackary Ouirzane — Developer</title>
<meta name="description" content="Portfolio of Zackary Ouirzane, a computer science technology student seeking a software development internship in spring 2027 and a developer job afterwards.">
<meta name="theme-color" content="#05060B">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="#top">
      <svg class="bolt" viewBox="0 0 16 22" aria-hidden="true"><path d="M10.5 0 1 12.5h5.2L4.6 22 15 8.8H9.4z" fill="currentColor"/></svg>
      <span>ZACKARY OUIRZANE</span>
    </a>
    <div class="nav-right">
      <nav aria-label="Main">
        <a href="#projects" data-i18n="navProjects"></a>
        <a href="#about" data-i18n="navAbout"></a>
        <a href="#contact" data-i18n="navContact"></a>
      </nav>
      <div class="lang" role="group" aria-label="Language / Langue">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
  </div>
</header>

<main id="top">

  <section class="hero" id="hero">
    <canvas id="storm" aria-hidden="true"></canvas>
    <div class="glow-fallback"></div>
    <div class="wrap hero-body">
      <div class="hero-text">
        <p class="status"><span class="dot" aria-hidden="true"></span><span data-i18n="status"></span></p>
        <h1>Zackary Ouirzane</h1>
        <p class="lead" data-i18n="lead"></p>
        <p class="actions">
          <a class="btn btn-main" href="#projects" data-i18n="viewProjects"></a>
          <a class="btn" href="resume.pdf" data-i18n="resume"></a>
          <a class="btn" href="https://github.com/Gothrick" rel="noopener">GitHub</a>
        </p>
      </div>
      <ul class="hero-facts">
        <li data-i18n="heroFact1"></li>
        <li data-i18n="heroFact2"></li>
        <li data-i18n="heroFact3"></li>
      </ul>
    </div>
  </section>

  <section class="readouts" aria-label="At a glance">
    <div class="wrap readouts-grid">
      <div class="readout">
        <div class="label" data-i18n="statStartLabel"></div>
        <span class="seg" id="stat-days" data-ghost="888">000</span>
        <div class="sub" data-i18n="statStartSub"></div>
      </div>
    </div>
  </section>

  <section id="projects" class="section">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="selectedWork"></h2>
        <span class="mono muted" id="projects-count"></span>
      </div>
      <div class="workbench">
        <div class="tablist" role="tablist" aria-orientation="vertical" id="tablist" aria-label="Projects"></div>
        <div class="panel" role="tabpanel" id="panel" tabindex="0"></div>
      </div>
    </div>
  </section>

  <section id="about" class="section">
    <div class="wrap two-col">
      <div>
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutP1"></p>
        <p data-i18n="aboutP2"></p>
      </div>
      <div>
        <h2 data-i18n="skillsTitle"></h2>
        <dl class="skills" id="skills"></dl>
      </div>
    </div>
  </section>

  <section id="contact" class="section contact">
    <div class="wrap">
      <h2 data-i18n="contactTitle"></h2>
      <p><a class="email" href="mailto:zackaryouirzane@gmail.com">zackaryouirzane@gmail.com</a></p>
      <p class="actions">
        <a class="btn btn-main" href="#projects" data-i18n="viewProjects"></a>
        <a class="btn" href="resume.pdf" data-i18n="resume"></a>
        <a class="btn" href="https://github.com/Gothrick" rel="noopener">GitHub</a>
      </p>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-links mono">
      <a href="mailto:zackaryouirzane@gmail.com">Email</a>
      <a href="https://github.com/Gothrick" rel="noopener">GitHub</a>
      <a href="resume.pdf" data-i18n="resumeShort"></a>
      <span>© <span id="year"></span> Zackary Ouirzane</span>
    </div>
    <div class="clock">
      <span class="label" data-i18n="clockLabel"></span>
      <span class="seg" id="clock" data-ghost="88:88:88" aria-hidden="true">00:00:00</span>
    </div>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="projects.js"></script>
<script src="auto-projects.js"></script>
<script src="script.js"></script>

</html>
