name: Deploy site

# Rebuilds the site when it changes, every day (to pick up new public repos),
# and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build cards from public repositories
        run: node scripts/sync-repos.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          SITE_REPO: ${{ github.event.repository.name }}

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html 404.html favicon.svg styles.css script.js i18n.js projects.js auto-projects.js resume.pdf images fonts _site/
          # Stamp the stylesheet and scripts with this build, so browsers fetch the new ones
          # instead of showing a cached copy for up to ten minutes.
          sed -i -E "s#(href|src)=\"(styles\.css|i18n\.js|projects\.js|auto-projects\.js|script\.js)\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
